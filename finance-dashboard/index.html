<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanceTrack — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body data-theme="light">

  <!-- Mobile sidebar overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-shell">

    <!-- Sidebar  -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-icon">
            <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="34" height="34" rx="8" fill="#1a8cff"/>
              <!-- F letter -->
              <text x="7" y="24" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="white">F</text>
              <!-- green trend line -->
              <polyline points="18,27 22,22 26,24 30,19" stroke="#2ecc71" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <circle cx="30" cy="19" r="1.6" fill="#2ecc71"/>
            </svg>
          </span>
          <span class="brand-name">Fintrak</span>
        </div>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">✕</button>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item" data-page="dashboard">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
              d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-page="transactions">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
              d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/>
            <line stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" x1="9" y1="12" x2="15" y2="12"/>
            <line stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" x1="9" y1="16" x2="13" y2="16"/>
          </svg>
          <span class="nav-label">Transactions</span>
        </a>
        <a href="#" class="nav-item" data-page="insights">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
              d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2zm0 0V9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v10m-6 0a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2m0 0V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/>
          </svg>
          <span class="nav-label">Insights</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="role-badge" id="roleBadge">
          <span class="role-dot"></span>
          <span class="role-text">Viewer</span>
        </div>
      </div>
    </aside>

    <!-- Main Wrapper  -->
    <div class="main-wrapper">

      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <button class="hamburger" id="hamburger" aria-label="Open menu">
            <span></span><span></span><span></span>
          </button>
          <h1 class="page-title" id="pageTitle">Dashboard</h1>
        </div>
        <div class="header-right">
          <div class="role-switcher">
            <label for="roleSelect">Role:</label>
            <select id="roleSelect" title="Switch role">
              <option value="viewer">Viewer</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <button class="theme-toggle" id="themeToggle" title="Toggle dark/light mode">
            <span class="theme-icon">🌙</span>
          </button>
        </div>
      </header>

      <!-- Page Content -->
      <main class="main-content">

        <!-- Dashboard  -->
        <section class="page hidden" id="dashboardPage">

          <!-- Summary Cards -->
          <div class="summary-cards" id="summaryCards"></div>

          <!-- Charts -->
          <div class="charts-grid">
            <div class="card chart-card" style="position:relative">
              <div class="card-header">
                <h3>Balance Trend</h3>
                <span class="card-subtitle">Jan — Apr 2026</span>
              </div>
              <!-- Floating stats card -->
              <div id="balanceHoverCard" class="balance-hover-card hidden">
                <div class="bhc-month"></div>
                <div class="bhc-rows">
                  <div class="bhc-row">
                    <span class="bhc-label">Balance</span>
                    <span class="bhc-value bhc-balance"></span>
                  </div>
                  <div class="bhc-row">
                    <span class="bhc-label">Income</span>
                    <span class="bhc-value" style="color:#34d399"></span>
                  </div>
                  <div class="bhc-row">
                    <span class="bhc-label">Expenses</span>
                    <span class="bhc-value" style="color:#f87171"></span>
                  </div>
                </div>
              </div>
              <div class="chart-container">
                <canvas id="balanceTrendChart"></canvas>
              </div>
            </div>
            <div class="card chart-card">
              <div class="card-header">
                <h3>Spending Breakdown</h3>
                <span class="card-subtitle" id="donutSubtitle">Click a slice to explore</span>
              </div>
              <div class="chart-container chart-container--donut">
                <canvas id="spendingBreakdownChart" style="cursor:pointer"></canvas>
              </div>
            </div>
          </div>

          <!-- Recent Transactions -->
          <div class="card">
            <div class="card-header">
              <h3>Recent Transactions</h3>
              <a href="#" class="view-all" data-page="transactions">View All →</a>
            </div>
            <div id="recentTransactions"></div>
          </div>

        </section>

        <!--  Transactions  -->
        <section class="page hidden" id="transactionsPage">
          <div class="card card--static">
            <div id="transactionsToolbar"></div>
            <div id="transactionsList"></div>
          </div>
        </section>

        <!-- Insights  -->
        <section class="page hidden" id="insightsPage">
          <div id="insightsContent"></div>
        </section>

      </main>
    </div>
  </div>

  <!--  Add/Edit Modal -->
  <div class="modal-overlay hidden" id="modalOverlay" role="dialog" aria-modal="true">
    <div class="modal" id="transactionModal">
      <div class="modal-header">
        <h3 id="modalTitle">Add Transaction</h3>
        <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Scripts (load order matters) -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/transactions.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
